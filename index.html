<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noarchive, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷题">
<meta name="theme-color" content="#0b1020">
<title>CPA 刷题</title>
<style>
:root { --bg: #f4f6fa; --card: #ffffff; --fill: #eef1f6; --line: #dde2ea; --t1: #141a26; --t2: #5b6577; --t3: #98a1b0; --accent: #0f9f8f; --accent-ink: #ffffff; --accent-soft: rgba(15, 159, 143, .12); --ok: #1a9a5c; --ok-soft: rgba(26, 154, 92, .12); --bad: #d64562; --bad-soft: rgba(214, 69, 98, .1); --warn: #c98a1e; --warn-soft: rgba(224, 164, 58, .14); --hook: #7b5cc8; --hook-soft: rgba(139, 111, 209, .1); }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --card: #141b2e; --fill: #1b2338; --line: #263049; --t1: #eef2fa; --t2: #a3adc2; --t3: #6c7690; --accent: #5ee0cf; --accent-ink: #062320; --accent-soft: rgba(94, 224, 207, .14); --ok: #3ddc97; --ok-soft: rgba(61, 220, 151, .14); --bad: #ff6b86; --bad-soft: rgba(255, 107, 134, .13); --warn: #f0b454; --warn-soft: rgba(240, 180, 84, .13); --hook: #ad94f0; --hook-soft: rgba(173, 148, 240, .12); color-scheme: dark; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--t1); }
body { font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", sans-serif; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 680px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }

/* 顶栏 */
header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: -.3px; }
header .sub { font-size: 13px; color: var(--t2); }
.back { font-size: 15px; color: var(--t2); padding: 6px 0; }

/* 书 */
#books { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
#books button { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
#books button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 总进度 */
.sum { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.sum .big { font-size: 30px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.sum .big small { font-size: 14px; font-weight: 400; color: var(--t2); margin-left: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.sum .row { display: flex; gap: 16px; margin-top: 10px; font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums; }
.sum .row b { color: var(--t1); }
.modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.modes button { padding: 12px 6px; border-radius: 12px; background: var(--fill); font-size: 14px; font-weight: 600; text-align: center; }
.modes button small { display: block; font-size: 12px; font-weight: 400; color: var(--t2); }
.modes button.pri { background: var(--accent); color: var(--accent-ink); }
.modes button.pri small { color: inherit; opacity: .75; }

/* 章节 */
h2 { font-size: 14px; color: var(--t2); font-weight: 600; margin: 22px 0 8px; }
.ch { display: flex; align-items: center; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.ch .code { flex: none; width: 44px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.ch .nm { flex: 1; min-width: 0; }
.ch .nm b { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch .nm .bar { height: 4px; margin-top: 6px; }
.ch .ct { flex: none; margin-left: 12px; font-size: 13px; color: var(--t2); text-align: right; font-variant-numeric: tabular-nums; }
.ch .ct .w { color: var(--bad); display: block; }

/* 做题 */
#q .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--t2); margin-top: 4px; }
#q .meta b { color: var(--t1); }
#q .qbar { height: 4px; margin-top: 8px; }
#q h3 { margin: 14px 0 2px; font-size: 18px; line-height: 1.4; }
#q h3 small { display: block; font-size: 12px; font-weight: 400; color: var(--t3); margin-top: 2px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; margin-right: 6px; background: var(--fill); color: var(--t2); vertical-align: 2px; }
.tag.w { background: var(--bad-soft); color: var(--bad); }
.md p { margin: 0 0 .6em; }
.md ul { margin: .3em 0 .5em; padding-left: 1.2em; }
.md li { margin: .15em 0; }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 14px; margin: .5em 0; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
.md th { background: var(--fill); }
.stem { margin-top: 10px; }
.op { display: flex; width: 100%; text-align: left; margin-top: 10px; padding: 13px 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); line-height: 1.5; font-size: 15.5px; transition: transform .1s; }
.op:active { transform: scale(.985); }
.op b { flex: none; width: 26px; font-weight: 700; color: var(--t2); }
.op.right { border-color: var(--ok); background: var(--ok-soft); } .op.right b { color: var(--ok); }
.op.wrong { border-color: var(--bad); background: var(--bad-soft); } .op.wrong b { color: var(--bad); }
.op.dim { opacity: .5; }
.vd { margin: 18px 0 6px; font-size: 18px; font-weight: 700; }
.vd.ok { color: var(--ok); } .vd.bad { color: var(--bad); }
.tp { font-size: 13px; color: var(--t2); margin-bottom: 8px; }
.xs { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; background: var(--accent-soft); font-size: 15px; }
.xs > b { color: var(--accent); }
.xs ul { margin: 4px 0 0; padding-left: 1.2em; } .xs p { margin: 4px 0 0; }
.xs-concl { border-left-color: var(--ok); background: var(--ok-soft); } .xs-concl > b { color: var(--ok); }
.xs-trap { border-left-color: var(--warn); background: var(--warn-soft); } .xs-trap > b { color: var(--warn); }
.xs-hook { border-left-color: var(--hook); background: var(--hook-soft); } .xs-hook > b { color: var(--hook); }
/* 问 AI */
.ai { margin-top: 20px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.ai .hd { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--t2); }
.ai select { font: inherit; font-size: 13px; color: var(--t1); background: var(--fill); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
.ai .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.ai .two button { padding: 11px 8px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 15px; text-align: center; line-height: 1.35; }
.ai .two button small { display: block; font-size: 12px; font-weight: 400; color: var(--t2); }
.note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--t1); font-size: 13px; line-height: 1.6; }
.note a, .fb a { color: var(--accent); font-weight: 600; text-decoration: none; }
.fb { margin-top: 12px; font-size: 13px; color: var(--t2); text-align: right; }
.empty { padding: 40px 0; text-align: center; color: var(--t2); }

/* 底栏 */
#dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
#dock .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px; }
#dock button { height: 50px; border-radius: 14px; background: var(--fill); font-weight: 600; font-size: 15px; }
#dock button.on { background: var(--bad-soft); color: var(--bad); }
#dock #nx { background: var(--accent); color: var(--accent-ink); }
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 8px 16px; border-radius: 99px; background: var(--t1); color: var(--bg); font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
#toast.on { opacity: .92; }
footer { margin-top: 28px; font-size: 12px; color: var(--t3); line-height: 1.6; }
footer a { color: var(--t2); }
</style>
</head>
<body>
<main>
  <section id="home">
    <header><div><h1>CPA 刷题</h1><div class="sub">进度只存在这台手机的浏览器里</div></div></header>
    <div id="books"></div>
    <div class="note">⚠️ 题目和解析由 AI 生成，<b>未经专业人士逐题审核</b>，可能有错；准则和数字以 AICPA 官方资料为准。发现错误欢迎 <a href="https://github.com/brucewayne0107/exam-quiz/issues" target="_blank" rel="noopener">反馈</a>（每道题下面也有反馈入口）。</div>
    <div class="sum" id="sum"></div>
    <h2>按章节</h2>
    <div id="chs"></div>
    <footer>题目和解析来自 <a href="https://github.com/brucewayne0107/exam-quiz">exam-quiz</a>，按 <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans">CC BY-SA 4.0</a> 发布。<br>清掉浏览器数据会丢进度；可以在下面导出 / 导入。<br><button id="exp" style="text-decoration:underline">导出进度</button> · <button id="imp" style="text-decoration:underline">导入进度</button></footer>
  </section>
  <section id="q" hidden>
    <header><button class="back" id="bk">‹ 章节</button><span class="sub" id="qmode"></span></header>
    <div class="meta"><span id="qpos"></span><span id="qsc"></span></div>
    <div class="bar qbar"><i id="qfill"></i></div>
    <div id="qbody"></div>
  </section>
</main>
<div id="dock" hidden><div class="in"><button id="pv">上一题</button><button id="mk">★ 错题</button><button id="nx">下一题</button></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
